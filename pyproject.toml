[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vsss-coach"
version = "0.2.0"
description = "Genetic-programming-ready vector-field strategy for TraveSim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "protobuf>=4,<7",
  "VSSProto",
]

[project.optional-dependencies]
dev = []
wandb = ["wandb>=0.19,<1"]

[project.scripts]
vsss-coach = "vsss_coach.client:main"
vsss-coach-evolve = "vsss_coach.evolution:main"
vsss-coach-dashboard = "vsss_coach.dashboard:main"
vsss-coach-live = "vsss_coach.live:main"
vsss-coach-distributed = "vsss_coach.distributed:main"
vsss-coach-role-trials = "vsss_coach.role_trials:main"
vsss-coach-role-dashboard = "vsss_coach.role_dashboard:main"
vsss-coach-role-compare = "vsss_coach.goalkeeper_compare:main"

[tool.setuptools.packages.find]
where = ["src"]
