[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coach-silvs"
version = "0.2.0"
description = "Genetic-programming-ready vector-field strategy for TraveSim"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "protobuf>=4,<7",
  "VSSProto",
]

[project.optional-dependencies]
dev = []
wandb = ["wandb>=0.19,<1"]

[project.scripts]
coach-silvs = "coach_silvs.client:main"
coach-silvs-evolve = "coach_silvs.evolution:main"
coach-silvs-dashboard = "coach_silvs.dashboard:main"
coach-silvs-live = "coach_silvs.live:main"
coach-silvs-distributed = "coach_silvs.distributed:main"
coach-silvs-role-trials = "coach_silvs.role_trials:main"
coach-silvs-role-dashboard = "coach_silvs.role_dashboard:main"
coach-silvs-role-compare = "coach_silvs.goalkeeper_compare:main"

[tool.setuptools.packages.find]
where = ["src"]
